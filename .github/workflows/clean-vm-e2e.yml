name: Clean User VM DMG / Windows / Linux E2E Gate (Free Public Runner)

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify (default: latest)"
        required: false
        default: "latest"
        type: string

concurrency:
  group: clean-vm-e2e-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-user-e2e-test:
    name: "macOS Clean User VM DMG Install & Real-LLM 6-Stage GUI E2E"
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Public E2E Verification Harness (Zero App Source Code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. Download Official ValidTeam.dmg & Release Assets from Public Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p ~/Downloads/validteam-installer
          cd ~/Downloads/validteam-installer
          if [ "${TARGET_TAG}" = "latest" ] || [ -z "${TARGET_TAG}" ]; then
            gh release download --repo "${GITHUB_REPOSITORY}" \
              -p "ValidTeam.dmg" \
              -p "ValidTeam-macos.zip" \
              -p "latest-macos.json" \
              -p "SHA256SUMS.txt" \
              --clobber
          else
            gh release download "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" \
              -p "ValidTeam.dmg" \
              -p "ValidTeam-macos.zip" \
              -p "latest-macos.json" \
              -p "SHA256SUMS.txt" \
              --clobber
          fi
          ls -lh ~/Downloads/validteam-installer
          cat latest-macos.json
          shasum -a 256 ValidTeam.dmg ValidTeam-macos.zip

      - name: 3. Purge Pre-installed Developer Tools (Ensure Pure User Mac Environment)
        run: |
          echo "==> Removing any pre-installed Go, Node, or AI CLIs on runner to match real user Mac..."
          sudo rm -rf /usr/local/go /usr/local/bin/go /usr/local/bin/gofmt /usr/local/Cellar/go* /opt/homebrew/opt/go /opt/homebrew/bin/go /opt/homebrew/bin/gofmt /opt/homebrew/Cellar/go* || true
          rm -rf "$HOME/go" "$HOME/.nvm" "$HOME/.local/share/opencode" "$HOME/.config/opencode" || true
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v go >/dev/null 2>&1; then
            echo "❌ ERROR: 'go' binary still exists at $(command -v go)"
            exit 1
          fi
          echo "✅ Verified: Pure user macOS environment (No Go compiler, No OpenCode CLI, No app source code)."

      - name: 4. Simulate Browser Quarantine, Verify Apple Notarization Ticket & Gatekeeper, and Run Clean-VM OTA Gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          DMG_FILE="$HOME/Downloads/validteam-installer/ValidTeam.dmg"
          QUARANTINE_VAL="0081;67300000;Safari;12345678-1234-1234-1234-1234567890AB"
          xattr -w com.apple.quarantine "$QUARANTINE_VAL" "$DMG_FILE"

          echo "==> Verifying Apple Notarization Ticket & Gatekeeper on quarantined DMG..."
          xcrun stapler validate "$DMG_FILE"
          spctl -a -t open --context context:primary-signature -v "$DMG_FILE"

          rm -rf "/Applications/Valid Team.app"
          MOUNT_DIR="/Volumes/Valid Team"
          hdiutil attach "$DMG_FILE" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          ditto "$MOUNT_DIR/Valid Team.app" "/Applications/Valid Team.app"
          hdiutil detach "$MOUNT_DIR"

          xattr -w com.apple.quarantine "$QUARANTINE_VAL" "/Applications/Valid Team.app"
          echo "==> Active com.apple.quarantine attribute on /Applications/Valid Team.app:"
          xattr -p com.apple.quarantine "/Applications/Valid Team.app"

          echo "==> Verifying Developer ID Signature, Stapled Ticket & Gatekeeper WITH com.apple.quarantine intact..."
          codesign --verify --deep --strict --verbose=2 "/Applications/Valid Team.app"
          xcrun stapler validate "/Applications/Valid Team.app"
          spctl -a -t exec -v "/Applications/Valid Team.app"

          echo "==> Running Clean-VM macOS OTA gate (PREV_TAG != TARGET_TAG, required, never silently skip)..."
          if [ ! -s "./scripts/macos_clean_ota_e2e.sh" ]; then
            echo "❌ Missing or empty required macOS Clean-VM OTA script: ./scripts/macos_clean_ota_e2e.sh" >&2
            exit 1
          fi
          chmod +x ./scripts/macos_clean_ota_e2e.sh
          ./scripts/macos_clean_ota_e2e.sh

      - name: 5. Run 6-Stage Real-LLM GUI E2E in Pure User Environment (OpenCode Go · deepseek-v4.1-flash)
        env:
          CI: "true"
          PATH: "/usr/bin:/bin:/usr/sbin:/sbin"
          VTEAM_TEST_API_KEY: ${{ secrets.VTEAM_TEST_API_KEY }}
          VTEAM_TEST_API_NAME: ${{ vars.VTEAM_TEST_API_NAME || 'opencode-go' }}
          VTEAM_TEST_API_FORMAT: ${{ vars.VTEAM_TEST_API_FORMAT || 'openai' }}
          VTEAM_TEST_API_BASE_URL: ${{ vars.VTEAM_TEST_API_BASE_URL || 'https://opencode.ai/inference/go/openai/v1' }}
          VTEAM_TEST_API_MODEL: ${{ vars.VTEAM_TEST_API_MODEL || 'deepseek-v4.1-flash' }}
        run: |
          chmod +x ./scripts/ci_complex_e2e_test.sh
          ./scripts/ci_complex_e2e_test.sh

      - name: 6. Prepare Clean-User GUI Screenshots & Logs
        if: always()
        run: |
          mkdir -p test-artifacts/logs
          cp -f ~/Library/Logs/ValidTeam/*.log test-artifacts/logs/ 2>/dev/null || true

      - name: 7. Upload Clean-User GUI Screenshots Bundle (5-Day Retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ValidTeam-macOS-GUI-Test-Bundle
          retention-days: 5
          path: test-artifacts/

  windows-native-smoke:
    name: "Windows x64 Real E2E (Checksum · Silent Install · Real-LLM Tools · Dirty Env · Shell DPI/Icon)"
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 1. Checkout Public E2E Verification Harness (Zero App Source Code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 2. Download Pre-Built Windows Assets & Enforce SHA256 + Prerelease Test Bins
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dlDir = Join-Path $env:RUNNER_TEMP "vt-win"
          New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
          Push-Location $dlDir
          try {
            $isSpecificTag = (-not [string]::IsNullOrWhiteSpace($env:TARGET_TAG)) -and ($env:TARGET_TAG -ne "latest")
            if (-not $isSpecificTag) {
              gh release download --repo "$env:GITHUB_REPOSITORY" -p "ValidTeam-Setup.exe" -p "ValidTeam-windows-amd64.zip" -p "SHA256SUMS-windows.txt" -p "latest-windows.json" --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to download latest Windows release assets" }
            } else {
              $relMeta = gh release view "$env:TARGET_TAG" --repo "$env:GITHUB_REPOSITORY" --json isPrerelease,assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $relMeta) { throw "Failed to inspect release metadata for $env:TARGET_TAG" }
              $isPrerelease = [bool]$relMeta.isPrerelease
              $remoteAssets = @($relMeta.assets | ForEach-Object { $_.name })
              if ($remoteAssets -notcontains "ValidTeam-Setup.exe") {
                throw "Missing pre-built ValidTeam-Setup.exe on release $env:TARGET_TAG (public-repo packaging is permanently abolished)"
              }
              gh release download "$env:TARGET_TAG" --repo "$env:GITHUB_REPOSITORY" -p "ValidTeam-Setup.exe" -p "ValidTeam-windows-amd64.zip" -p "SHA256SUMS-windows.txt" -p "latest-windows.json" --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to download Windows release assets for $env:TARGET_TAG" }
              if ($isPrerelease) {
                gh release download "$env:TARGET_TAG" --repo "$env:GITHUB_REPOSITORY" -p "*.test.exe" --clobber
                if ($LASTEXITCODE -ne 0) { throw "Failed to download required *.test.exe on prerelease $env:TARGET_TAG" }
                foreach ($reqBin in @("core-platform.test.exe", "vteam-statedb.test.exe", "windows-app.test.exe", "va-sdk.test.exe", "va-llm.test.exe")) {
                  if (-not (Test-Path -LiteralPath $reqBin) -or (Get-Item -LiteralPath $reqBin).Length -le 0) { throw "Missing or empty required prerelease test binary: $reqBin" }
                }
                "VTEAM_REQUIRE_WIN_TEST_BINS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
            foreach ($reqAsset in @("ValidTeam-Setup.exe", "ValidTeam-windows-amd64.zip", "SHA256SUMS-windows.txt", "latest-windows.json")) {
              if (-not (Test-Path -LiteralPath $reqAsset) -or (Get-Item -LiteralPath $reqAsset).Length -le 0) {
                throw "Missing or empty required Windows release asset: $reqAsset"
              }
            }
            Get-Content SHA256SUMS-windows.txt
            foreach ($line in Get-Content SHA256SUMS-windows.txt) {
              if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
                $expected = $Matches[1].ToLowerInvariant()
                $file = $Matches[2].Trim()
                if (Test-Path -LiteralPath $file) {
                  $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actual -ne $expected) {
                    throw "SHA256 mismatch for ${file}: expected $expected, got $actual"
                  }
                  Write-Host "[OK] SHA256 verified for $file"
                }
              }
            }
            $winManifest = Get-Content -LiteralPath "latest-windows.json" -Raw | ConvertFrom-Json
            $zipActual = (Get-FileHash -LiteralPath "ValidTeam-windows-amd64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            $setupActual = (Get-FileHash -LiteralPath "ValidTeam-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($winManifest.zip_sha256.ToLowerInvariant() -ne $zipActual) {
              throw "latest-windows.json zip_sha256 mismatch"
            }
            if ($winManifest.setup_sha256.ToLowerInvariant() -ne $setupActual) {
              throw "latest-windows.json setup_sha256 mismatch"
            }
            Write-Host "[OK] latest-windows.json verified (version=$($winManifest.version), build=$($winManifest.build))"
          } finally {
            Pop-Location
          }

      - name: 3. Silent Install ValidTeam-Setup.exe, --ci-selftest, Real-LLM Tools, Dirty Env, Shell DPI/Icon & Clean-VM OTA E2E
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
          VTEAM_TEST_API_KEY: ${{ secrets.VTEAM_TEST_API_KEY }}
          VTEAM_TEST_API_NAME: ${{ vars.VTEAM_TEST_API_NAME || 'opencode-go' }}
          VTEAM_TEST_API_FORMAT: ${{ vars.VTEAM_TEST_API_FORMAT || 'openai' }}
          VTEAM_TEST_API_BASE_URL: ${{ vars.VTEAM_TEST_API_BASE_URL || 'https://opencode.ai/inference/go/openai/v1' }}
          VTEAM_TEST_API_MODEL: ${{ vars.VTEAM_TEST_API_MODEL || 'deepseek-v4.1-flash' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:CI -eq "true" -and [string]::IsNullOrWhiteSpace($env:VTEAM_TEST_API_KEY)) {
            throw "CI=true requires VTEAM_TEST_API_KEY secret for Windows real-LLM E2E (silent skip is strictly forbidden)"
          }
          $dlDir = Join-Path $env:RUNNER_TEMP "vt-win"
          $setupExe = Join-Path $dlDir "ValidTeam-Setup.exe"
          $proc = Start-Process -FilePath $setupExe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Installer failed with exit code $($proc.ExitCode)"
          }
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\ValidTeam"
          $guiExe = Join-Path $installDir "ValidTeam.exe"
          $vteamExe = Join-Path $installDir "vteam.exe"
          if (-not (Test-Path -LiteralPath $guiExe)) { throw "Missing $guiExe" }
          if (-not (Test-Path -LiteralPath $vteamExe)) { throw "Missing $vteamExe" }

          # Stage an old backup marker to confirm post-healthy startup cleanup
          Set-Content -LiteralPath (Join-Path $installDir "vteam.exe.old") -Value "stale" -Encoding ASCII
          $stOut = Join-Path $env:RUNNER_TEMP "selftest-out.txt"
          $stErr = Join-Path $env:RUNNER_TEMP "selftest-err.txt"
          $stProc = Start-Process -FilePath $guiExe -ArgumentList "--ci-selftest" -Wait -PassThru -RedirectStandardOutput $stOut -RedirectStandardError $stErr
          $out = (Get-Content -LiteralPath $stOut -Raw -ErrorAction SilentlyContinue)
          $err = (Get-Content -LiteralPath $stErr -Raw -ErrorAction SilentlyContinue)
          Write-Host $out
          if ($err) { Write-Host $err }
          if ($stProc.ExitCode -ne 0 -or $out -notmatch "WIN_GUI_SELFTEST_OK") {
            throw "ValidTeam.exe --ci-selftest failed (exit=$($stProc.ExitCode))"
          }
          if (Test-Path -LiteralPath (Join-Path $installDir "vteam.exe.old")) {
            throw "vteam.exe.old was not cleaned up after healthy startup"
          }
          if (Get-Process -Name "vteam" -ErrorAction SilentlyContinue) {
            throw "Lingering vteam.exe process detected after ValidTeam.exe exit"
          }

          # Verify portable archive extracts cleanly and vteam --version works
          $portDir = Join-Path $env:RUNNER_TEMP "vt-win-portable"
          Expand-Archive -LiteralPath (Join-Path $dlDir "ValidTeam-windows-amd64.zip") -DestinationPath $portDir -Force
          $portVteam = Get-ChildItem -Path $portDir -Filter "vteam.exe" -Recurse | Select-Object -First 1
          if (-not $portVteam) { throw "Portable ZIP missing vteam.exe" }
          & $portVteam.FullName --version

          # Run real Clean-VM OTA + NTFS SQLite + Real-LLM Tools + Dirty Env + Shell DPI/Icon E2E (all modular scripts required)
          $winRealE2E = "./scripts/windows_real_e2e.ps1"
          foreach ($reqScript in @($winRealE2E, "./scripts/windows_real_llm_e2e.ps1", "./scripts/windows_dirty_env_and_shell_e2e.ps1")) {
            if (-not (Test-Path -LiteralPath $reqScript) -or (Get-Item -LiteralPath $reqScript).Length -le 0) {
              throw "Missing or empty required Windows E2E script: $reqScript"
            }
          }
          & $winRealE2E -InstallDir $installDir -DownloadDir $dlDir -PortableDir $portDir -ReleaseRepo $env:GITHUB_REPOSITORY -TargetTag $env:TARGET_TAG

  linux-native-smoke:
    name: "Linux ${{ matrix.arch }} Native Smoke (clean tar · Canary Health · Real SQLite Project)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: 1. Download Linux Package & Checksums from Public Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p ~/vt && cd ~/vt
          if [ "${TARGET_TAG}" = "latest" ] || [ -z "${TARGET_TAG}" ]; then
            gh release download --repo "${GITHUB_REPOSITORY}" -p "ValidTeam-linux-${{ matrix.arch }}.tar.gz" -p "SHA256SUMS-linux.txt"
          else
            gh release download "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" -p "ValidTeam-linux-${{ matrix.arch }}.tar.gz" -p "SHA256SUMS-linux.txt"
          fi
          sha256sum -c --ignore-missing SHA256SUMS-linux.txt

      - name: 2. Extract with GNU tar (stderr MUST be empty)
        run: |
          set -euo pipefail
          cd ~/vt
          tar -xzf "ValidTeam-linux-${{ matrix.arch }}.tar.gz" 2> tar.stderr
          if [ -s tar.stderr ]; then
            echo "❌ GNU tar extract produced warnings:"; cat tar.stderr; exit 1
          fi
          echo "✅ GNU tar extract stderr is empty"
          test "$(uname -m)" = "${{ matrix.uname }}"
          file "ValidTeam-linux-${{ matrix.arch }}/vteam"

      - name: 3. Run ./vteam, verify /api/status canary_ok=true & create real SQLite project
        run: |
          set -euo pipefail
          cd ~/vt/ValidTeam-linux-${{ matrix.arch }}
          ./vteam --help | head -n 5
          ./vteam --version
          TEST_HOME="$(mktemp -d)"
          export HOME="${TEST_HOME}"
          mkdir -p "${TEST_HOME}/ws"
          printf 'default_model = "selftest/mock"\n\n[[api]]\nname = "selftest"\nformat = "openai"\nbase_url = "http://127.0.0.1:9/v1"\nkey = "sk-selftest-placeholder"\nmodels = ["mock"]\n' > "${TEST_HOME}/security.toml"
          chmod 600 "${TEST_HOME}/security.toml"
          ./vteam -root "${TEST_HOME}/ws" -security "${TEST_HOME}/security.toml" > "${RUNNER_TEMP}/vteam.log" 2>&1 &
          VT_PID=$!
          trap 'kill "${VT_PID}" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            STATUS_JSON="$(curl -fsS http://127.0.0.1:8787/api/status 2>/dev/null || true)"
            if printf '%s' "${STATUS_JSON}" | grep -q '"daemon_health":"healthy"' && printf '%s' "${STATUS_JSON}" | grep -q '"canary_ok":true'; then
              READY=1
              break
            fi
            sleep 0.5
          done
          cat "${RUNNER_TEMP}/vteam.log"
          if [ "${READY}" -ne 1 ]; then
            echo "❌ /api/status did not reach canary_ok=true & daemon_health=healthy"; exit 1
          fi
          HDR_FILE="${RUNNER_TEMP}/linux-proj-hdr.txt"
          curl -fsS -D "${HDR_FILE}" -o /dev/null -X POST -d "name=linux-smoke-proj" http://127.0.0.1:8787/projects
          grep -qE '^HTTP/[0-9.]+ 303' "${HDR_FILE}"
          grep -qiE '^Location:[[:space:]]*/projects/linux-smoke-proj' "${HDR_FILE}"
          test -s "${TEST_HOME}/ws/linux-smoke-proj/state.db"
          test -s "${TEST_HOME}/ws/linux-smoke-proj/.statedb_healthy.json"
          kill "${VT_PID}" || true
          echo "✅ Linux ${{ matrix.arch }}: ./vteam canary_ok=true, daemon_health=healthy & SQLite project verified"
